<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1525"/>
      <stop offset="1" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="mark" x1="300" y1="280" x2="740" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CF6FF"/>
      <stop offset="1" stop-color="#00C2D6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded app background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="224" fill="none" stroke="#00F0FF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Upward growth bars (finance motif) -->
  <g opacity="0.9">
    <rect x="360" y="600" width="54" height="120" rx="18" fill="#00F0FF" fill-opacity="0.35"/>
    <rect x="452" y="520" width="54" height="200" rx="18" fill="#00F0FF" fill-opacity="0.55"/>
    <rect x="544" y="430" width="54" height="290" rx="18" fill="#00F0FF" fill-opacity="0.8"/>
    <rect x="636" y="330" width="54" height="390" rx="18" fill="#00F0FF"/>
  </g>

  <!-- RS monogram -->
  <text x="512" y="470" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="300" font-weight="800" letter-spacing="-10" fill="url(#mark)" filter="url(#glow)">RS</text>
</svg>
